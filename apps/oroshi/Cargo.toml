[package]
name = "oroshi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oroshi-nix = { path = "../../crates/oroshi-nix" }
oroshi-store = { path = "../../crates/oroshi-store" }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
base64 = "0.22"
sha2 = "0.10"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "matched-path"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "fs", "io-util", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
tempfile = "3"
